name: Android APK (Kotlin / Expo)

on:
  push:
    branches: [main, sortify-kotlin]
    tags: [kotlin-v*, expo-v*]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build branch APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "1"
    outputs:
      edition: ${{ steps.target.outputs.edition }}
      version: ${{ steps.target.outputs.version }}
      artifact: ${{ steps.target.outputs.artifact }}
      prerelease: ${{ steps.target.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select branch build and validate release tag
        id: target
        shell: python
        run: |
          import json
          import os
          import pathlib
          import re
          import subprocess

          ref = os.environ["GITHUB_REF"]
          is_tag = ref.startswith("refs/tags/")
          if ref == "refs/heads/sortify-kotlin" or ref.startswith("refs/tags/kotlin-v"):
              edition, branch, directory = "kotlin", "sortify-kotlin", "."
              gradle = pathlib.Path("app/build.gradle.kts").read_text()
              version = re.search(r'versionName\s*=\s*"([^"]+)"', gradle).group(1)
          elif ref == "refs/heads/main" or ref.startswith("refs/tags/expo-v"):
              edition, branch, directory = "expo", "main", "android"
              version = json.loads(pathlib.Path("app.json").read_text())["expo"]["version"]
          else:
              raise SystemExit("Choose main or sortify-kotlin, or an expo-v* / kotlin-v* tag.")

          if not re.fullmatch(r"\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?", version):
              raise SystemExit(f"Unsupported app version: {version}")
          if is_tag:
              expected = f"{edition}-v{version}"
              if os.environ["GITHUB_REF_NAME"] != expected:
                  raise SystemExit(f"Tag must match the app version: {expected}")
              subprocess.run(["git", "merge-base", "--is-ancestor", "HEAD", f"origin/{branch}"], check=True)

          suffix = "" if is_tag else f'-{os.environ["GITHUB_SHA"][:7]}'
          artifact = f"Sortify-{edition}-{version}{suffix}"
          values = dict(edition=edition, version=version, directory=directory,
                        artifact=artifact, prerelease=str("-" in version).lower())
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for key, value in values.items():
                  print(f"{key}={value}", file=output)

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          # Override v3's default, which includes the removed SDK package "tools".
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: actions/setup-node@v4
        if: steps.target.outputs.edition == 'expo'
        with:
          node-version: "22"
          cache: npm

      - name: Install Expo dependencies
        if: steps.target.outputs.edition == 'expo'
        run: npm ci

      - name: Generate Expo Android project
        if: steps.target.outputs.edition == 'expo'
        run: npx --no-install expo prebuild --platform android --non-interactive --no-install

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: ${{ steps.target.outputs.directory }}
        # bash handles wrappers checked in from Windows without an executable bit.
        run: bash ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify signed APK and prepare download
        env:
          BUILD_DIRECTORY: ${{ steps.target.outputs.directory }}
          ARTIFACT_NAME: ${{ steps.target.outputs.artifact }}
        run: |
          apk="$BUILD_DIRECTORY/app/build/outputs/apk/release/app-release.apk"
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$apksigner" verify --verbose "$apk"
          mkdir -p dist/ci
          cp "$apk" "dist/ci/$ARTIFACT_NAME.apk"
          cd dist/ci
          sha256sum "$ARTIFACT_NAME.apk" > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.target.outputs.artifact }}
          path: dist/ci/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish branch release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      EDITION: ${{ needs.build.outputs.edition }}
      VERSION: ${{ needs.build.outputs.version }}
      PRERELEASE: ${{ needs.build.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: release-assets

      - name: Publish APK and checksum
        run: |
          if [ "$EDITION" = kotlin ]; then
            label="Kotlin"
          else
            label="Expo"
          fi
          printf '%s\n' \
            "Sortify $label v$VERSION. Built from tag $RELEASE_TAG." \
            "" \
            "Installable release APK signed with a debug key; no private keystore secrets used." \
            "Not suitable for Play Store submission. A different signing key requires uninstalling the previous app, which removes its local data." \
            > release-notes.md
          flags=()
          if [ "$EDITION" = kotlin ] || [ "$PRERELEASE" = true ]; then
            flags+=(--latest=false)
          fi
          if [ "$PRERELEASE" = true ]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag --title "Sortify $label v$VERSION" \
            --notes-file release-notes.md "${flags[@]}"
